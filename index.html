  const min = c.rendaAltura || C.rendaAltura || 24, pos = c.rendaPos || 'ambas',
    st = `background-image:url('${c.renda}');height:${min}px`, at = ` data-renda="${c.renda}" data-min="${min}"`;
  return (pos !== 'base' ? `<i class="renda topo"${at} style="${st}"></i>` : '') + (pos !== 'topo' ? `<i class="renda base"${at} style="${st}"></i>` : '');
};

/* altura automática da renda conforme o formato da imagem (evita rendas minúsculas) */
function alturaRenda(w, h, min, max) { return Math.round(Math.min(max, Math.max(min, (C.rendaTile || 360) * h / w))); }
function ajustarRendas() {
  const cache = {};
  document.querySelectorAll('.renda[data-renda]').forEach(el => {
    const s = el.dataset.renda, min = +el.dataset.min;
    (cache[s] = cache[s] || new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = s; }))
      .then(i => { if (i && i.naturalWidth) el.style.height = alturaRenda(i.naturalWidth, i.naturalHeight, min, C.rendaAlturaMax || 110) + 'px'; });
  });
}

/* renda da galeria: FAIXA (bem mais larga que alta) vira topo + base + laterais; MOLDURA inteira fica por cima */
function galRenda(img) {
  const w = img.parentNode;
  if (img.naturalWidth / img.naturalHeight > 1.5) {
    w.style.setProperty('--fh', alturaRenda(img.naturalWidth, img.naturalHeight, (C.galeria && C.galeria.rendaFaixaAltura) || 28, 90) + 'px');
    const st = `background-image:url('${img.src}')`;
    img.remove();
    w.classList.remove('com-renda'); w.classList.add('com-faixa');
    w.insertAdjacentHTML('beforeend', `<i class="gal-faixa topo" style="${st}"></i><i class="gal-faixa base" style="${st}"></i><i class="gal-lado esq" style="${st}"></i><i class="gal-lado dir" style="${st}"></i>`);
  }
}

const nomeHTML = (cls, branca, logo) => { const L = logo || C.logoNome; return L ? `<img class="logo-nome${branca && C.logoRodapeBranca !== false ? ' branca' : ''}" src="${L}" alt="${C.nome}">` : `<div class="${cls}">${C.nome}</div>`; };
const extrairId = u => { const m = (u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; };
const fm = (d, o) => new Intl.DateTimeFormat('pt-BR', o).format(d);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hora = d => fm(d, { hour: '2-digit', minute: '2-digit' }).replace(':', 'h');
const ev = C.eventos, d0 = new Date(ev[0].dataHora);
const dataTexto = C.dataTexto || (ev.map(e => fm(new Date(e.dataHora), { day: '2-digit' })).join(' e ') + ' de ' + cap(fm(d0, { month: 'long' })) + ' de ' + fm(d0, { year: 'numeric' }));
document.title = `${C.nome} — XV Anos`;

const corSec = c => c && c.cor ? ` style="background-color:${c.cor}"` : '';

/* fundo de seção: imagem, gif ou vídeo (repetir:false = vídeo toca uma vez só) */
const fundoHTML = (c, cor) => {
  if (!c || !c.fundo) return '';
  const s = c.fundo, ehVideo = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(s),
    el = ehVideo ? `<video class="bg" src="${s}" ${c.repetir === false ? 'muted playsinline webkit-playsinline preload="metadata" data-uma-vez' : 'autoplay muted loop playsinline webkit-playsinline preload="metadata"'} onerror="this.style.display='none'"></video>` : `<img class="bg" src="${s}" alt="">`;
  return el + (c.veu > 0 ? `<div class="veu" style="background:${c.cor || cor};opacity:${c.veu}"></div>` : '');
};

/* 🎵 Música */
let audio = null, yt = null, tocando = false, quer = false;
const mb = $('#musicBtn');
if (C.musica) { audio = new Audio(C.musica); audio.loop = true; audio.volume = .7; }
else if (extrairId(C.youtube)) { const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); }
else mb.style.display = 'none';
function onYouTubeIframeAPIReady() {
  const id = extrairId(C.youtube);
  yt = new YT.Player('yt', { videoId: id, playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: id, playsinline: 1 }, events: { onReady: () => { if (quer) tocar(); } } });
}
function tocar() {
  quer = true;
  if (audio) audio.play().catch(() => {}); else if (yt && yt.playVideo) yt.playVideo(); else return;
  mb.classList.add('tocando'); tocando = true;
}
function pausar() { quer = false; if (audio) audio.pause(); else if (yt && yt.pauseVideo) yt.pauseVideo(); mb.classList.remove('tocando'); tocando = false; }
mb.onclick = () => tocando ? pausar() : tocar();

/* ✉️ Abertura */
const intro = $('#intro'), A = C.abertura || {};
if (A.cor) intro.style.backgroundColor = A.cor;
if (A.imagem) { const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = A.imagem; document.head.appendChild(l); }
const carregar = src => new Promise(ok => {
  if (!src || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(src)) return ok();
  const i = new Image(); i.onload = i.onerror = ok; i.src = src; setTimeout(ok, 4000);
});
const capaPronta = carregar(C.capa && C.capa.fundo);
let saiu = false;
function entrar() {
  if (saiu) return; saiu = true;
  capaPronta.then(() => { intro.classList.add('open'); document.body.classList.remove('locked'); tocar(); setTimeout(() => intro.remove(), 1100); });
}
if (A.usar !== false) {
  let aberto = false;
  const abrir = () => {
    if (aberto) return; aberto = true; tocar();
    const v = $('#introVid');
    if (!v) return entrar();
    /* se o vídeo não começar em 6 s (internet lenta, formato não suportado, economia de dados), abre o convite sem ele */
    let rodando = false, espera = null;
    const limite = setTimeout(() => { if (!rodando) entrar(); }, 6000);
    v.addEventListener('playing', () => { rodando = true; clearTimeout(limite); clearTimeout(espera); v.classList.add('pronto'); });
    v.addEventListener('waiting', () => { clearTimeout(espera); espera = setTimeout(entrar, 6000); });
    v.onended = v.onclick = v.onerror = entrar;
    const tentar = () => { const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; const q = v.play(); if (q && q.catch) q.catch(entrar); }); };
    tentar();
  };
  if (A.imagem) intro.style.backgroundImage = `url("${A.imagem}")`;
  const vid = A.video ? `<video id="introVid" src="${A.video}" ${A.imagem ? `poster="${A.imagem}"` : ''} playsinline preload="auto"></video>` : '';
  intro.innerHTML = A.imagem
    ? `${vid}<button class="selo-clique" id="abrir" aria-label="Abrir convite"></button>`
    : `${vid}<button class="selo" id="abrir">${A.texto || 'Abrir'}</button>`;
  if (A.imagem) {
    intro.onclick = abrir;
    /* se a imagem de abertura não carregar, mostra o botão redondo visível */
    const t = new Image();
    t.onerror = () => { intro.style.backgroundImage = 'none'; const b = $('#abrir'); if (b) { b.className = 'selo'; b.textContent = A.texto || 'Abrir'; } };
    t.src = A.imagem;
  }
  $('#abrir').onclick = e => { e.stopPropagation(); abrir(); };
} else { intro.remove(); document.body.classList.remove('locked'); }

/* Seções */
const secoes = [];
const CFG = { convite: C.mensagem, contagem: C.contagem && { ...C.contagem, renda: C.contagem.renda || C.renda }, dia: C.programacao, local: C.local, traje: C.dressCode, galeria: C.galeria, hospedagem: C.hospedagem, presentes: C.presentes, confirmar: C.rsvp };
const sec = (id, rot, html, cls = '') => {
  const cor = cls.includes('escuro') ? 'var(--enfase)' : cls.includes('alt') ? 'var(--secaoAlt)' : 'var(--fundo)';
  secoes.push(`<section class="sec ${cls}" id="${id}"${corSec(CFG[id])}>${fundoHTML(CFG[id], cor)}${rendaHTML(CFG[id])}<div class="wrap">${html}</div></section>`);
};
const tit = (t, s) => `${s ? `<p class="sub">${s}</p>` : ''}<h2>${t}</h2><div class="orn">♥</div>`;
const ICONE_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3.2 3.2 5.8-6.4"/></svg>`;

const capa = `<header class="hero" id="inicio"${corSec(C.capa)}>${fundoHTML(C.capa, 'var(--fundo)')}${rendaHTML(C.capa)}
  <div class="capa-card">
    <p class="sub">${C.celebracao}</p>
    ${nomeHTML('nome')}
    <p class="sub">XV Anos</p>
    <p class="frase">“${C.capa.frase}”</p>
    <div class="orn">♥</div>
    <p class="data data-capa">${dataTexto}</p>
    <p class="sub" style="margin-top:6px">${C.cidade}</p>
  </div></header>`;

/* Mensagem: logo no lugar do nome + texto mais abaixo */
const M = C.mensagem;
if (M) sec('convite', 'Convite', `${(M.usarLogo !== false && C.logoNome) ? `<img class="logo-nome" src="${C.logoNome}" alt="${C.nome}"><p class="sub">XV Anos</p><div class="orn">♥</div>` : tit(M.titulo)}<p class="texto" style="margin-top:${M.textoEspaco != null ? M.textoEspaco : 28}px">${M.texto}</p>${M.foto ? `<img class="foto" src="${M.foto}" alt="${C.nome}">` : ''}`);

if (C.contagem) sec('contagem', 'Contagem', `<p class="sub">${C.contagem.subtitulo || ''}</p><h2>${C.contagem.titulo}</h2><div id="cd" class="cd" style="margin-top:22px"></div>`, 'escuro');

const P = C.programacao;
if (P) {
  const itens = P.itens || ev.map(e => { const d = new Date(e.dataHora); return { hora: hora(d), dia: fm(d, { day: '2-digit', month: 'short' }).replace('.', ''), titulo: e.titulo, descricao: e.espaco }; });
  sec('dia', 'Programação', `${tit(P.titulo, P.subtitulo)}<div class="tl">${itens.map(i => `<div class="tl-i"><div class="tl-h">${i.hora}<small>${i.dia || ''}</small></div><div class="tl-d">♥</div><div class="tl-t"><b>${i.titulo}</b><span>${i.descricao || ''}</span></div></div>`).join('')}</div>`);
}

if (C.local) sec('local', 'Local', tit(C.local.titulo) + ev.map(e => {
  const d = new Date(e.dataHora), q = [e.espaco, e.endereco, C.cidade].filter(Boolean).join(' ');
  return `<div class="ev-card"${corSec(e)}>${fundoHTML(e, 'var(--secaoAlt)')}<div class="ev-conteudo"><p class="sub">${e.titulo}</p><h3 class="ev-nome">${e.espaco}</h3>
    <p class="data">${cap(fm(d, { weekday: 'long' }))}, ${fm(d, { day: 'numeric', month: 'long' })} · ${hora(d)}</p>
    ${e.endereco ? `<p class="texto" style="margin-top:6px">${e.endereco}</p>` : ''}
    <a class="btn" style="margin-top:16px" href="${e.mapsUrl || 'https://www.google.com/maps/search/?api=1&query=' + enc(q)}" target="_blank" rel="noopener">Como chegar</a></div></div>`;
}).join(''), 'alt');

const D = C.dressCode, coresD = D ? (D.cores || []).filter(Boolean) : [];
if (D && (D.texto || coresD.length)) sec('traje', 'Traje', `${tit(D.titulo)}${D.texto ? `<p class="texto">${D.texto}</p>` : ''}${coresD.length ? `<div class="cores">${coresD.map(c => `<i style="background:${c}"></i>`).join('')}</div>` : ''}`);

const GA = C.galeria, fotosG = GA ? (GA.fotos || []).filter(Boolean) : [];
if (fotosG.length) sec('galeria', 'Galeria', `${tit(GA.titulo || 'Galeria')}
  <div class="gal-wrap${GA.rendaMoldura ? ' com-renda' : ''}" style="--fh:${GA.rendaFaixaAltura || 28}px"><div class="carrossel">${fotosG.map((g, i) => `<div class="slide${i ? '' : ' ativo'}"><img src="${g}" alt="Foto ${i + 1}" loading="lazy"></div>`).join('')}
  ${fotosG.length > 1 ? `<div class="pontos">${fotosG.map((_, i) => `<i class="${i ? '' : 'ativo'}"></i>`).join('')}</div>` : ''}</div>
  ${GA.rendaMoldura ? `<img class="gal-renda" src="${GA.rendaMoldura}" alt="" style="--esc:${GA.escalaMoldura || 1.3}" onload="galRenda(this)">` : ''}</div>`, 'alt');

const H = C.hospedagem;
if (H) sec('hospedagem', 'Hospedagem', `${tit(H.titulo)}<p class="texto">${H.texto}</p>` + H.lista.map(h => `<div class="ev">${h.imagem ? `<img src="${h.imagem}" alt="${h.nome}" style="margin-bottom:14px">` : ''}<h3>${h.nome}</h3><a class="btn" style="margin-top:14px" href="${h.link}" target="_blank" rel="noopener">${h.botao || 'Saiba mais'}</a></div>`).join(''));

const G = C.presentes;
if (G && (G.texto || (G.itens || []).length)) sec('presentes', 'Presentes', `${tit(G.titulo)}${G.texto ? `<p class="texto">${G.texto}</p>` : ''}${(G.itens || []).length ? `<div class="ev">${G.itens.map(i => `<p class="texto">${i}</p>`).join('')}</div>` : ''}`, 'alt');

/* Confirmar presença: só o aviso, sem formulário */
const R = C.rsvp;
if (R) sec('confirmar', 'Confirmar', `${tit(R.titulo)}
  <div class="rsvp-ico" aria-hidden="true">${R.iconeImagem ? `<img src="${R.iconeImagem}" alt="">` : ICONE_OK}</div>
  <p class="texto" style="margin-top:18px">${R.mensagem}</p>`, 'alt');

$('#app').innerHTML = capa + secoes.join('') + `<footer>${rendaHTML(C.rodape)}${nomeHTML('script', true, C.logoRodape)}<p>${C.hashtag}</p></footer>`;

window.__pronto = true;

/* ajusta o tamanho das rendas conforme a imagem enviada */
try { ajustarRendas(); } catch (e) {}

/* vídeos que tocam uma vez só: começam quando a seção aparece na tela e param no último quadro */
document.querySelectorAll('video[data-uma-vez]').forEach(v => {
  v.muted = true;
  const play = () => v.play().catch(() => {});
  if ('IntersectionObserver' in window) {
    const o = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { play(); o.disconnect(); } }), { threshold: .35 });
    o.observe(v.closest('section') || v);
  } else play();
});

/* Animações de entrada e contagem */
const rvs = document.querySelectorAll('.wrap, footer');
rvs.forEach(e => e.classList.add('rv'));
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
  rvs.forEach(e => io.observe(e));
} else rvs.forEach(e => e.classList.add('in'));

function contagem() {
  const el = $('#cd'); if (!el) return;
  const dif = d0 - new Date();
  if (dif <= 0) { el.innerHTML = '<span style="font-size:.8rem">É HOJE!</span>'; return; }
  const n = [Math.floor(dif / 864e5), Math.floor(dif % 864e5 / 36e5), Math.floor(dif % 36e5 / 6e4), Math.floor(dif % 6e4 / 1e3)];
  el.innerHTML = n.map((v, i) => `<div><b>${String(v).padStart(2, '0')}</b><span>${['dias', 'horas', 'min', 'seg'][i]}</span></div>`).join('');
}
contagem(); setInterval(contagem, 1000);

/* Galeria: troca automática de fotos */
const slides = document.querySelectorAll('.slide'), pontos = document.querySelectorAll('.pontos i'); let cur = 0;
if (slides.length > 1) setInterval(() => {
  slides[cur].classList.remove('ativo'); pontos[cur].classList.remove('ativo');
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add('ativo'); pontos[cur].classList.add('ativo');
}, 4000);
</script>
</body>
</html>
